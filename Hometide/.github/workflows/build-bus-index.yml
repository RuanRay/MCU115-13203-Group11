# 國道客運路線索引（規格 8.6、GUIDE 3.4-6）：每日產生「站牌 → 路線與站序」索引寫入 Worker KV
# 需在 GitHub Repository Secrets 設定：TDX_CLIENT_ID、TDX_CLIENT_SECRET、CF_API_TOKEN（權限 Workers KV Storage: Edit）、CF_ACCOUNT_ID
name: build-bus-index

on:
  schedule:
    - cron: "0 19 * * *" # 臺灣時間 03:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-index.ts
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: 76ed0323095945cf8c062f43bcb68a39 # 與 worker/wrangler.toml 一致，非機密
